name: TimeMachine compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  production-build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 25 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Java 21 runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 clean build --console=plain
      - if: runner.os != 'Windows'
        run: ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 clean build --console=plain
