name: Feature request
description: Propose a focused improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Describe the operational problem rather than only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data-safety and compatibility impact
      description: Consider failure recovery, stored data, server-thread work, permissions, and configuration upgrades.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Backup creation
        - Verification or restore
        - Scheduling
        - Storage or metadata
        - Documentation or tooling
        - Other
    validations:
      required: true
